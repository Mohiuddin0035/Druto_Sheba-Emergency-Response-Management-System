<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b65" />
      <stop offset="100%" stop-color="#d00045" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff2d55" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Glowing Rounded Square App Icon -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#brandRedGrad)" filter="url(#softGlow)" />

  <!-- Lucide-style ECG Pulse Line (Activity Waveform) -->
  <path 
    d="M14 32 H23 L27 18 L35 46 L39 26 L43 32 H50" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="4.2" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>
